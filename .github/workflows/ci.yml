name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      # Tests build their own synthetic data; data-dependent tests skip when the
      # (gitignored) processed files are absent, exactly as in a fresh clone.
      - run: python -m pytest -q
